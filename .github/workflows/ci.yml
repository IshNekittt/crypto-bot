name: CI Test & Typecheck Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Strict TypeScript Typecheck
        run: npm run typecheck

      # Generates gh-pages-report/index.html (jest-html-reporters)
      # and coverage/lcov-report/ (--coverage), consumed by the Pages job below.
      - name: Run Jest Test Suite with HTML and Coverage Reports
        run: npm run test:ci

      - name: Verify Clean Build
        run: npm run build

      - name: Assemble GitHub Pages bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p gh-pages-dist/coverage
          cp -R gh-pages-report/. gh-pages-dist/
          cp -R coverage/lcov-report/. gh-pages-dist/coverage/
          touch gh-pages-dist/.nojekyll

      - name: Deploy reports to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-dist
          publish_branch: gh-pages
