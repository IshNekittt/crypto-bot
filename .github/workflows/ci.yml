name: CI Test & Typecheck Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Run Jest Test Suite (850+ Tests)
        run: npm test -- --runInBand

      - name: Verify Clean Build
        run: npm run build
